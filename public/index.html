    // ===== EFEITOS SONOROS (Web Audio) =====
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.value = 0.15;
        if (type === 'add') {
          const bufferSize = audioCtx.sampleRate * 0.3;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.1));
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const noiseGain = audioCtx.createGain();
          noiseGain.gain.value = 0.3;
          noise.connect(noiseGain);
          noiseGain.connect(audioCtx.destination);
          noise.start();
          noise.stop(audioCtx.currentTime + 0.3);
          return;
        }
        if (type === 'like') {
          osc.frequency.value = 800;
          osc.type = 'sine';
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
          return;
        }
        osc.frequency.value = 600;
        osc.type = 'sine';
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    // ===== AUTENTICAÇÃO =====
    function showLogin() { $('landingScreen').style.display = 'none'; $('loginScreen').classList.add('active'); }
    function hideLogin() { $('loginScreen').classList.remove('active'); }
    function openSignup() { hideLogin(); $('signupModal').classList.add('active'); }
    function closeSignup() { $('signupModal').classList.remove('active'); $('landingScreen').style.display = 'block'; }
    function toggleChip(el) { el.classList.toggle('selected'); }

    async function submitSignup() {
      const nome = $('signupNome').value.trim(), email = $('signupEmail').value.trim(), senha = $('signupPassword').value.trim();
      const estilos = Array.from(document.querySelectorAll('#signupStyles .chip.selected')).map(c => c.dataset.style);
      if (nome.length < 2) return toast('Digite seu nome','error');
      if (!email.includes('@')) return toast('E-mail inválido','error');
      if (senha.length < 6) return toast('Senha deve ter 6+ caracteres','error');
      if (estilos.length === 0) return toast('Escolha um estilo musical','error');
      try {
        const res = await fetch('/api/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ nome, email, senha, estilos }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const loginRes = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, senha }) });
        const loginData = await loginRes.json();
        if (!loginRes.ok) throw new Error(loginData.error);
        currentUser = loginData.user;
        myName = currentUser.nome;
        myAvatar = currentUser.avatar || '🎸';
        myPoints = currentUser.points || 0;
        myBadges = currentUser.badges || [];
        if (currentUser.theme) { currentTheme = currentUser.theme; applyTheme(); }
        closeSignup(); hideLogin(); $('landingScreen').style.display = 'none';
        showScreen('lobby'); updateUserInfo(); loadRooms(); checkAdmin(); loadFavorites();
        toast('Bem-vindo(a) ' + myName + '! 🎉','success');
        if (pendingRoomAfterLogin) { const s = pendingRoomAfterLogin; pendingRoomAfterLogin = null; setTimeout(() => joinRoom(s), 1000); }
      } catch(e) { toast(e.message || 'Erro ao criar conta','error'); }
    }

    async function doLogin() {
      const email = $('loginEmail').value.trim(), senha = $('loginPassword').value.trim();
      const errorEl = $('loginError');
      if (!email || !senha) { errorEl.textContent = 'Preencha e-mail e senha'; errorEl.classList.add('show'); return; }
      const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, senha }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        currentUser = data.user;
        myName = currentUser.nome;
        myAvatar = currentUser.avatar || '🎸';
        myPoints = currentUser.points || 0;
        myBadges = currentUser.badges || [];
        if (currentUser.theme) { currentTheme = currentUser.theme; applyTheme(); }
        hideLogin(); $('landingScreen').style.display = 'none';
        showScreen('lobby'); updateUserInfo(); loadRooms(); checkAdmin(); loadFavorites();
        toast('Bem-vindo(a) de volta ' + myName + '!','success');
        if (pendingRoomAfterLogin) { const s = pendingRoomAfterLogin; pendingRoomAfterLogin = null; setTimeout(() => joinRoom(s), 1000); }
      } catch(e) { errorEl.textContent = e.message || 'Erro ao fazer login'; errorEl.classList.add('show'); }
      finally { btn.disabled = false; btn.textContent = 'Entrar no palco'; }
    }

    function doLogout() {
      fetch('/api/logout', { method:'POST' }).catch(()=>{});
      if (currentRoom) { socket.emit('leaveRoom'); currentRoom = null; }
      currentUser = null; showScreen('lobby'); $('screen-lobby').classList.remove('active');
      $('landingScreen').style.display = 'block'; hideLogin();
      toast('Você saiu','success');
    }

      $('userDisplayName').textContent = myName;

      if (radioControls) radioControls.style.display = isAdmin ? 'flex' : 'none';
      if (isAdmin && currentRoomData) {
        $('radioToggle').checked = currentRoomData.radioMode || false;
        $('radioGenre').value = currentRoomData.radioGenre || 'pop';
      }
    }

    // ===== YOUTUBE =====
    function loadYouTubeAPI() { if(window.YT && window.YT.Player){ initPlayer(); return; } const tag=document.createElement('script'); tag.src='https://www.youtube.com/iframe_api'; document.head.appendChild(tag); }
    function onYouTubeIframeAPIReady() { initPlayer(); }
    function initPlayer() {
      if(player)return;
      player = new YT.Player('youtube-player', {
        height:'280', width:'100%',
        playerVars:{ autoplay:1, controls:0, disablekb:1, fs:0, rel:0, modestbranding:1, enablejsapi:1 },
        events: {
          onReady:()=>{ if(currentRoomData) syncPlayer(currentRoomData); },
          onStateChange:(e)=>{
            if(e.data === YT.PlayerState.PLAYING) {
              // 🔥 GARANTE O VOLUME CORRETO QUANDO A MÚSICA COMEÇA
              const vol = parseInt($('volumeSlider').value);
              if (player && player.setVolume) {
                player.setVolume(vol);
              }
              try {
                const d = player.getDuration();
                if (d > 0) socket.emit('videoDuration', { duration: Math.floor(d) });
              } catch (e) {}
              if (crossfadeInterval) { clearInterval(crossfadeInterval); crossfadeInterval = null; }
              fadeVolume(vol, 500);
              $('bufferingOverlay').classList.remove('show');
            }
            if(e.data === YT.PlayerState.BUFFERING) {
              $('bufferingOverlay').classList.add('show');
            }
            if(e.data === YT.PlayerState.ENDED) socket.emit('videoEnded');
          },
          onError:()=>{ toast('Erro no vídeo, pulando...','error'); setTimeout(()=>socket.emit('videoEnded'),2000); }
        }
      });
    }

    function syncPlayer(state) {
      $('roomTitle').textContent = state.name;
      if(!player || !player.loadVideoById) return;
      currentRoomData = state;
      const track = state.queue[state.currentIndex];
      renderQueue(state.queue, state.currentIndex);
      updateNextTrack(state.queue, state.currentIndex);
      renderPinnedMessage(state.pinnedMessage);

      if (state.radioMode) {
        $('radioBadge').classList.remove('hidden');
        if (amIAdmin) $('radioToggle').checked = true;
      } else {
        $('radioBadge').classList.add('hidden');
        if (amIAdmin) $('radioToggle').checked = false;
      }

      if (!track) {
        currentTrackId = null;
        $('trackTitle').textContent = 'Fila vazia';
        $('trackArtist').textContent = 'Adicione uma música';
        $('trackDj').textContent = '';
        $('trackCover').innerHTML = '🎵';
        $('progressFill').style.width = '0%';
        $('currentTime').textContent = '0:00';
        $('totalTime').textContent = '0:00';
        try { player.stopVideo(); } catch (e) {}
        return;
      }

      if (currentTrackId !== track.id) {
        currentTrackId = track.id;
        // Carrega o vídeo
        player.loadVideoById({ videoId: track.id, startSeconds: Math.floor(state.position || 0) });

        // 🔥 FORÇA O VOLUME E INICIA A REPRODUÇÃO
        const vol = parseInt($('volumeSlider').value);
        setTimeout(() => {
          if (player && player.setVolume) {
            player.setVolume(vol);
            player.playVideo();
          }
        }, 300);

        $('trackTitle').textContent = track.title || 'Música';
        $('trackArtist').textContent = track.artist || 'Desconhecido';
        $('trackDj').textContent = '👤 ' + (track.dj || '');
        $('trackCover').innerHTML = `<img src="https://img.youtube.com/vi/${track.id}/mqdefault.jpg" alt="" onerror="this.parentElement.textContent='🎵'">`;

        const items = document.querySelectorAll('.queue-item');
        items.forEach((el, idx) => {
          if (idx === state.currentIndex) {
            el.classList.add('current');
            el.style.animation = 'none';
            setTimeout(() => el.style.animation = 'highlightFade 0.6s ease');
          } else el.classList.remove('current');
        });
      }
    }

    function updateNextTrack(queue, currentIndex) {
      const next = queue[currentIndex+1];
      const container = $('nextTrack');
      if(next) {
        container.style.display='flex';
        $('nextThumb').innerHTML=`<img src="https://img.youtube.com/vi/${next.id}/default.jpg" onerror="this.style.display='none'">`;
        $('nextTitle').textContent=next.title||'Música';
        $('nextArtist').textContent=next.artist||'Desconhecido';
      } else container.style.display='none';
    }

    // ===== SKIP VOTE =====

    // ===== CROSSFADE =====
    function startCrossfade() {
      if(crossfadeInterval){ clearInterval(crossfadeInterval); crossfadeInterval=null; }
      crossfadeInterval = setInterval(()=>{
        try {
          if(!player || !player.getCurrentTime) return;
          const duration = player.getDuration();
          if(!duration || duration<=0) return;
          const current = player.getCurrentTime();
          const remaining = duration - current;
          if(remaining <= 3 && remaining > 0) {
            const vol = parseInt($('volumeSlider').value);
            const targetVol=0; const steps=20; const step=vol/steps;
            let cVol=vol;
            const fadeOut=setInterval(()=>{ cVol=Math.max(0,cVol-step); if(player && player.setVolume) player.setVolume(Math.round(cVol)); if(cVol<=0) clearInterval(fadeOut); },50);
            setTimeout(()=>clearInterval(fadeOut),3000);
          }
        } catch(e){}
      },500);
    }
    function fadeVolume(target,duration) {
      const startVol = player.getVolume ? player.getVolume() : parseInt($('volumeSlider').value);
      const diff = target - startVol;
      const steps=20; const step=diff/steps; const interval=duration/steps;
      let current=startVol;
      const timer=setInterval(()=>{ current+=step; if((diff>0 && current>=target) || (diff<0 && current<=target)){ current=target; clearInterval(timer); } if(player && player.setVolume) player.setVolume(Math.round(current)); $('volumeSlider').value=Math.round(current); $('volumeValue').textContent=Math.round(current)+'%'; }, interval);
    }

    // ===== RENDER QUEUE =====
    function renderQueue(queue, currentIndex) {
      const list=$('queueList'); const count=$('queueCount');
      count.textContent = queue.length + ' música' + (queue.length!==1?'s':'');
      list.innerHTML='';
      if(queue.length===0){ list.innerHTML='<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:30px 0;">Nenhuma música na fila</div>'; return; }
      const isGlobalAdmin = currentUser && currentUser.email === 'admin@sonora.com';
      const isUserAdmin = amIAdmin || isGlobalAdmin;

      queue.forEach((track,i)=>{
        const div=document.createElement('div');
        div.className='queue-item' + (i===currentIndex?' current':'');
        if(i!==currentIndex && isUserAdmin){
          div.draggable=true; div.dataset.index=i; div.dataset.id=track.id;
          div.addEventListener('dragstart',(e)=>{ e.dataTransfer.setData('text/plain',i); div.classList.add('dragging'); });
          div.addEventListener('dragend',()=>div.classList.remove('dragging'));
          div.addEventListener('dragover',(e)=>e.preventDefault());
          div.addEventListener('drop',(e)=>{ e.preventDefault(); const from=parseInt(e.dataTransfer.getData('text/plain')); if(from===i || from===currentIndex)return; const newOrder=queue.map(t=>t.id); const [removed]=newOrder.splice(from,1); newOrder.splice(i,0,removed); socket.emit('reorderQueue',newOrder); });
        }
        const votes = queueVotes[i] || { up:[], down:[] };
        const upCount=votes.up.length, downCount=votes.down.length;
        const userVotedUp=votes.up.includes(myName), userVotedDown=votes.down.includes(myName);
        const total=upCount+downCount, score=upCount-downCount;
        let scoreClass='', scoreSymbol='⚪';
        if(score>0){ scoreClass='positive'; scoreSymbol='👍'; }
        if(score<0){ scoreClass='negative'; scoreSymbol='👎'; }
        div.innerHTML = `<span class="pos">${i===currentIndex?'▶':i+1}</span><div class="thumb"><img src="https://img.youtube.com/vi/${track.id}/default.jpg" onerror="this.style.display='none'"></div><div class="info"><div class="title">${escapeHtml(track.title||'Música')}</div><div class="artist">${escapeHtml(track.artist||'Desconhecido')}</div></div><span class="dj">${escapeHtml(track.dj||'')}</span><div class="queue-votes"><button class="vote-btn up ${userVotedUp?'voted-up':''}" onclick="event.stopPropagation();voteSong(${i},'up')"><span style="font-size:14px;">👍</span></button><span class="vote-count ${scoreClass}" title="Total: ${total} votos (${upCount} 👍, ${downCount} 👎)">${total>0?scoreSymbol+score:'0'}</span><button class="vote-btn down ${userVotedDown?'voted-down':''}" onclick="event.stopPropagation();voteSong(${i},'down')"><span style="font-size:14px;">👎</span></button></div>`;
        list.appendChild(div);
      });
    }

    function voteSong(index,type) {
      if(!currentRoom){ toast('Entre em uma sala para votar','error'); return; }
      if(currentRoomData && currentRoomData.currentIndex===index){ toast('Não é possível votar na música atual','error'); return; }
      socket.emit('voteSong',{index,type,room:currentRoom});
    }

    // ===== BUSCA INTEGRADA NO YOUTUBE =====
    function handleSearchInput(value) {
      if(searchTimeout) clearTimeout(searchTimeout);
      const results = $('searchResults');
      if(!value || value.length < 2){ results.classList.remove('show'); return; }
      searchTimeout = setTimeout(async ()=>{
        try {
          const r = await fetch(`/api/search-youtube?q=${encodeURIComponent(value)}`);
          const data = await r.json();
          if (!r.ok) {
            results.innerHTML = `<div style="color:var(--danger);padding:10px;text-align:center;font-size:13px;">⚠️ ${data.error || 'Erro na busca'}</div>`;
            results.classList.add('show');
            return;
          }
          if(!data.items || data.items.length===0){ results.innerHTML='<div style="color:var(--text-muted);padding:10px;text-align:center;font-size:13px;">Nenhum resultado encontrado</div>'; results.classList.add('show'); return; }
          results.innerHTML = data.items.map(item => `
            <div class="search-item" onclick="selectSearchResult('${item.id}','${escapeHtml(item.title)}','${escapeHtml(item.artist)}')">
              <img src="${item.thumb}" alt="">
              <div class="info"><div class="title">${escapeHtml(item.title)}</div><div class="artist">${escapeHtml(item.artist)}</div></div>
            </div>
          `).join('');
          results.classList.add('show');
        } catch(e){ results.innerHTML='<div style="color:var(--danger);padding:10px;text-align:center;font-size:13px;">⚠️ Erro de conexão. Tente novamente.</div>'; results.classList.add('show'); }
      }, 500);
    }

    function selectSearchResult(id, title, artist) {
      $('searchResults').classList.remove('show');
      $('songUrl').value = id;
      fetch(`/api/video-info?id=${id}`)
        .then(r=>r.json())
        .then(data=>{
          songData = { id, title, artist, duration: data.duration || null };
          showPreview(songData);
        })
        .catch(()=>{
          songData = { id, title, artist, duration: null };
          showPreview(songData);
        });
    }

    // ===== ADD SONG =====
    function extractYouTubeId(url) {
      if(!url)return '';
      if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      try { const u=new URL(url); if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0]||''; if(u.hostname.includes('youtube.com')){ const v=u.searchParams.get('v'); if(v)return v; const parts=u.pathname.split('/').filter(Boolean); const markers=['shorts','embed','live','watch']; const idx=parts.findIndex(p=>markers.includes(p)); if(idx>=0 && parts[idx+1]) return parts[idx+1]; } } catch(e){}
      const match=url.match(/[a-zA-Z0-9_-]{11}/); return match?match[0]:'';
    }

    async function previewSong() {
      const url=$('songUrl').value.trim();
      if(!url){ clearPreview(); return; }
      const videoId = extractYouTubeId(url);
      if(!videoId){ toast('Link do YouTube inválido','error'); clearPreview(); return; }
      const box=$('songPreview'); box.classList.remove('hidden');
      $('previewThumb').innerHTML='⏳'; $('previewTitle').textContent='Buscando...'; $('previewArtist').textContent='Analisando link'; $('previewStatus').textContent=''; $('previewActions').classList.add('hidden');
      try {
        const r=await fetch(`/api/video-info?id=${videoId}`);
        const data=await r.json();
        if(r.ok){ songData={id:videoId,title:data.title,artist:data.artist||'Desconhecido',duration:data.duration||null}; showPreview(songData); return; }
      } catch(e){
        try { const oembed=await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`); if(oembed.ok){ const d=await oembed.json(); songData={id:videoId,title:d.title||'Música do YouTube',artist:d.author_name||'Desconhecido',duration:null}; showPreview(songData); return; } } catch(e2){}
        toast('Erro ao buscar informações','error'); clearPreview();
      }
    }

    function showPreview(data) {
      const box=$('songPreview'); box.classList.remove('hidden');
      const thumbHtml=data.id?`<img src="https://img.youtube.com/vi/${data.id}/mqdefault.jpg" alt="" onerror="this.parentElement.textContent='🎵'">`:'🎵';
      const durBadge=data.duration>0?`<span class="song-preview-duration">${formatDuration(data.duration)}</span>`:'';
      $('previewThumb').innerHTML=thumbHtml+durBadge;
      $('previewTitle').textContent=data.title||'Música do YouTube';
      $('previewArtist').textContent=data.artist||'Desconhecido';
      const confirmBtn=document.querySelector('.song-preview-confirm');
      if(data.duration>0){
        if(data.duration>MAX_SONG_DURATION){ $('previewStatus').textContent=`⛔ Muito longo! ${formatDuration(data.duration)} > ${MAX_SONG_DURATION/60} min`; $('previewStatus').style.color='var(--danger)'; confirmBtn.disabled=true; confirmBtn.textContent='⛔ Muito longo'; }
        else if(data.duration>300){ $('previewStatus').textContent=`⚠️ ${formatDuration(data.duration)} - música longa (máx ${MAX_SONG_DURATION/60} min)`; $('previewStatus').style.color='var(--warning)'; confirmBtn.disabled=false; confirmBtn.textContent='✓ Adicionar'; }
        else { $('previewStatus').textContent=`✅ ${formatDuration(data.duration)} - dentro do limite`; $('previewStatus').style.color='var(--success)'; confirmBtn.disabled=false; confirmBtn.textContent='✓ Adicionar'; }
      } else { $('previewStatus').textContent='⚠️ Duração não verificada. O vídeo será verificado ao carregar.'; $('previewStatus').style.color='var(--warning)'; confirmBtn.disabled=false; confirmBtn.textContent='✓ Adicionar (sem verificação)'; }
      $('previewActions').classList.remove('hidden');
    }

    function clearPreview(){ $('songPreview').classList.add('hidden'); songData=null; }
    function confirmAdd() {
      if(!songData || !songData.id){ toast('Nenhuma música selecionada','error'); return; }
      if(songData.duration && songData.duration>MAX_SONG_DURATION){ toast(`⛔ Vídeo muito longo! Limite: ${MAX_SONG_DURATION/60} min`,'error'); return; }
      const now=Date.now(); if(now-lastAddTime<COOLDOWN){ const wait=Math.ceil((COOLDOWN-(now-lastAddTime))/1000); toast(`Aguarde ${wait}s`,'error'); return; }
      socket.emit('addSong',{id:songData.id,title:songData.title||'Música do YouTube',artist:songData.artist||'Desconhecido',duration:songData.duration||null});
      lastAddTime=Date.now(); $('songUrl').value=''; clearPreview(); startCooldown(); toast('🎵 Música adicionada!','success');
    }

    function addSong() {
      const url=$('songUrl').value.trim(); if(!url){ toast('Cole um link do YouTube','error'); return; }
      const videoId=extractYouTubeId(url); if(!videoId){ toast('Link inválido','error'); return; }
      if(songData && songData.id===videoId){ confirmAdd(); } else { previewSong(); }
    }

    function startCooldown() {
      const text=$('cooldownText'); let remaining=COOLDOWN/1000;
      text.textContent=`Aguarde ${Math.floor(remaining/60)}m${remaining%60}s`; text.classList.remove('hidden');
      const interval=setInterval(()=>{ remaining--; if(remaining>0) text.textContent=`Aguarde ${Math.floor(remaining/60)}m${remaining%60}s`; else { clearInterval(interval); text.classList.add('hidden'); } },1000);
    }

    function copyQueueIds() {
      if(!currentRoomData || !currentRoomData.queue || !currentRoomData.queue.length){ toast('Fila vazia','error'); return; }
      const ids=currentRoomData.queue.map(t=>t.id).join(',');
      navigator.clipboard.writeText(ids).then(()=>toast('📋 IDs copiados!','success')).catch(()=>toast('Erro ao copiar','error'));
    }

    function copyRoomLink() {
      const url = window.location.origin + '/?room=' + currentRoom;
      navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copiado!','success')).catch(()=>toast('Erro ao copiar','error'));
    }

    // ===== CHAT =====
    function renderMessage(msg) {
      const container=document.getElementById('chatMessagesInner'); if(!container)return;
      const div=document.createElement('div'); div.className='msg';
      const msgId=msg._id||'msg_'+Date.now()+'_'+Math.random().toString(36).substr(2,4); div.dataset.msgId=msgId;
      if(msg.isMusic){
        div.classList.add('msg-music');
        div.innerHTML=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;width:100%;"><span style="font-size:14px;">🎵</span><span style="font-weight:700;color:var(--accent);font-size:12px;">${escapeHtml(msg.user)}</span><span style="color:var(--text-muted);font-size:11px;">adicionou</span><span class="msg-time" style="opacity:1;margin-left:auto;font-size:10px;color:var(--text-muted);">${formatTime(msg.createdAt)}</span></div><div class="music-info" style="color:var(--text);font-weight:600;font-size:13px;">${escapeHtml(msg.musicTitle||'Música')} — ${escapeHtml(msg.musicArtist||'Desconhecido')}</div>`;
      } else if(msg.isSystem){
        div.classList.add('msg-system'); div.innerHTML=`<span class="msg-text" style="color:var(--text-muted);font-style:italic;font-size:12px;">${escapeHtml(msg.text)}</span>`;
      } else {
        const avatar=msg.avatar||'👤', color=msg.color||'#888';
        let text=escapeHtml(msg.text); text=text.replace(/@(\w+)/g,'<span style="color:var(--accent);font-weight:700;">@$1</span>');
        const likeData=messageLikesSync[msgId]||{likes:0,users:[]}; const liked=likeData.users.includes(myName); const count=likeData.likes||0;
        div.innerHTML=`<div style="display:flex;align-items:flex-start;gap:6px;width:100%;"><div class="msg-avatar" style="background:${color}22;color:${color};border-color:${color}40;">${avatar}</div><div class="msg-content"><div class="msg-header"><span class="msg-user" style="color:${color};">${escapeHtml(msg.user)}${msg.isAdmin?' 👑':''}</span><span class="msg-time">${formatTime(msg.createdAt)}</span></div><span class="msg-text">${text}</span><div class="msg-actions"><button class="msg-like-btn ${liked?'liked':''}" onclick="likeMessage('${msgId}',this)">${liked?'❤️':'🤍'} <span class="msg-like-count">${count}</span></button></div></div></div>`;
      }
      container.appendChild(div); limitChatMessages(container);
    }

    function limitChatMessages(container) {
      const messages=container.querySelectorAll('.msg'); const total=messages.length; if(total>10){ const toRemove=total-10; for(let i=0;i<toRemove;i++){ const msg=messages[i]; if(msg){ msg.classList.add('removing'); setTimeout(()=>{ if(msg.parentNode) msg.remove(); },400); } } }
    }

    function likeMessage(msgId,btn) {
      if(!currentRoom){ toast('Entre em uma sala para curtir','error'); return; }
      socket.emit('likeMessage',{messageId:msgId,room:currentRoom});
    }

    function updateLikeDisplay(msgId) {
      const likeData=messageLikesSync[msgId]; if(!likeData)return;
      const count=likeData.likes||0; const liked=likeData.users.includes(myName);
      const container=document.getElementById('chatMessagesInner'); if(!container)return;
      const msgElements=container.querySelectorAll('.msg'); let target=null;
      for(const el of msgElements){ if(el.dataset.msgId===msgId){ target=el; break; } }
      if(!target)return; const btn=target.querySelector('.msg-like-btn'); if(!btn)return;
      btn.innerHTML=`${liked?'❤️':'🤍'} <span class="msg-like-count">${count}</span>`;
      if(liked) btn.classList.add('liked'); else btn.classList.remove('liked');
    }

    function sendMessage() {
      const input=$('chatInput'); const text=input.value.trim(); if(!text)return;
      socket.emit('chat',{text:censorText(text)}); input.value='';
    }

    function toggleEmojis() { $('emojiPanel').classList.toggle('show'); }
    function insertEmoji(e) { $('chatInput').value += e; $('chatInput').focus(); $('emojiPanel').classList.remove('show'); }

    function setVolume(val) {
      $('volumeValue').textContent=val+'%';
      if(player && player.setVolume) player.setVolume(parseInt(val));
    }

    // ===== KEYBOARD SHORTCUTS =====
    document.addEventListener('keydown', (e) => {
      const roomActive = document.getElementById('screen-room').classList.contains('active');
      if(!roomActive) return;
      if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if(e.key === 'ArrowUp') {
        e.preventDefault();
        const v = Math.min(100, parseInt($('volumeSlider').value) + 5);
        $('volumeSlider').value = v;
        setVolume(v);
      }
      if(e.key === 'ArrowDown') {
        e.preventDefault();
        const v = Math.max(0, parseInt($('volumeSlider').value) - 5);
        $('volumeSlider').value = v;
        setVolume(v);
      }
    });

    // ===== SOCKET EVENTS =====
    socket.on('adminUsersUpdated', ()=>{ if(amIAdmin) loadAdminUsers(); });
    socket.on('userPoints', (data)=>{ if(data){ myPoints=data.points||0; myBadges=data.badges||[]; updateUserInfo(); } });
    socket.on('roomState', (state)=>{
      const prev = currentRoomData && currentRoomData.queue && currentRoomData.queue[currentRoomData.currentIndex] ? currentRoomData.queue[currentRoomData.currentIndex].id : null;
      const next = state.queue && state.queue[state.currentIndex] ? state.queue[state.currentIndex].id : null;
      if(next !== prev){ currentTrackId=null; if(next) setTimeout(startCrossfade,1000); }
      currentRoomData=state; syncPlayer(state);
    });
    socket.on('queueEmpty', ()=>{
      currentTrackId=null;
      $('trackTitle').textContent='Fila vazia'; $('trackArtist').textContent='Adicione uma música'; $('trackDj').textContent=''; $('trackCover').innerHTML='🎵';
      $('progressFill').style.width='0%'; $('currentTime').textContent='0:00'; $('totalTime').textContent='0:00'; $('nextTrack').style.display='none';
      try { player.stopVideo(); } catch(e){}
      renderQueue([],0); toast('Fila encerrada! Adicione músicas.','success');
    });
    socket.on('users', (users)=>{ $('userCount').textContent=users.length; });
    socket.on('chat', renderMessage);
    socket.on('chatHistory', (messages)=>{ const container=document.getElementById('chatMessagesInner'); if(!container)return; container.innerHTML=''; const start=Math.max(0,messages.length-10); const recent=messages.slice(start); recent.forEach(m=>renderMessage(m)); });
    socket.on('likeUpdate', (data)=>{ const {messageId,likes,users}=data; messageLikesSync[messageId]={likes,users}; updateLikeDisplay(messageId); });
    socket.on('likesState', (likesData)=>{ messageLikesSync=likesData||{}; const container=document.getElementById('chatMessagesInner'); if(!container)return; const msgElements=container.querySelectorAll('.msg'); for(const el of msgElements){ const msgId=el.dataset.msgId; if(msgId && messageLikesSync[msgId]) updateLikeDisplay(msgId); } });
    socket.on('voteUpdate', (data)=>{ const {index,up,down}=data; queueVotes[index]={up,down}; if(down.length>=DISLIKE_THRESHOLD){ toast(`👎 Música removida por votação! (${down.length} votos negativos)`,'error'); if(currentRoomData && currentRoomData.queue) renderQueue(currentRoomData.queue,currentRoomData.currentIndex); } else { if(currentRoomData && currentRoomData.queue) renderQueue(currentRoomData.queue,currentRoomData.currentIndex); } });
    socket.on('votesState', (votesData)=>{ queueVotes=votesData||{}; if(currentRoomData && currentRoomData.queue) renderQueue(currentRoomData.queue,currentRoomData.currentIndex); });
    socket.on('error', (msg)=>toast(msg,'error'));
    socket.on('isAdmin', (isAdmin)=>{ amIAdmin=isAdmin || currentUser?.email==='admin@sonora.com'; if(amIAdmin){ $('adminBadge').classList.remove('hidden'); toast('Você é admin desta sala!','success'); } checkAdmin(); });
    socket.on('kicked', (msg)=>{ alert(msg); leaveRoom(); });
    socket.on('banned', (msg)=>{ alert(msg); leaveRoom(); });
    socket.on('chatCleared', ()=>{ const container=document.getElementById('chatMessagesInner'); if(container){ container.innerHTML=''; const div=document.createElement('div'); div.className='msg msg-system'; div.innerHTML='<span class="msg-text">🧹 Chat limpo pelo admin</span>'; container.appendChild(div); } toast('Chat limpo!','success'); });
    socket.on('adminBroadcast', (data)=>{ toast(`📢 ${data.message}`,'success'); if(currentRoom){ const msg={user:'📢 Admin',text:data.message,isSystem:true,createdAt:new Date()}; renderMessage(msg); } });
    socket.on('roomClosed', (msg)=>{ alert(msg); leaveRoom(); });
    socket.on('skipVoteUpdate', ({votes,needed})=>{ toast(`🗳️ Votos para pular: ${votes}/${needed}`,'success'); });
    socket.on('waitingRoom', ({position, maxListeners, canJoin})=>{
      if (canJoin) {
        toast('🟢 Uma vaga foi liberada! Tentando entrar...', 'success');
        joinRoom(currentRoom);
      } else {
        toast(`⏳ Você está na fila de espera (posição ${position}). Aguarde uma vaga.`, 'error');
      }
    });
    socket.on('playSound', (type) => {
      playSound(type);
    });

    // ===== PROGRESS =====
    setInterval(()=>{
      if(!player || !player.getCurrentTime) return;
      try {
        const current=player.getCurrentTime(); const duration=player.getDuration();
        if(duration>0){ $('progressFill').style.width=(current/duration*100)+'%'; $('currentTime').textContent=formatDuration(current); $('totalTime').textContent=formatDuration(duration); }
      } catch(e){}
    },1000);

    // ===== INICIALIZAÇÃO =====
    function init() {
      setLanguage(currentLang);
      applyTheme();
      const params=new URLSearchParams(window.location.search); const room=params.get('room');
      if(room) pendingRoomAfterLogin=room;
      fetch('/api/me')
        .then(res=>{ if(res.ok)return res.json(); throw new Error('Não autenticado'); })
        .then(data=>{
          if(data.success && data.user){
            currentUser=data.user; myName=currentUser.nome; myAvatar=currentUser.avatar||'🎸';
            myPoints=currentUser.points||0; myBadges=currentUser.badges||[];
            if(currentUser.theme){ currentTheme=currentUser.theme; applyTheme(); }
            $('landingScreen').style.display='none'; hideLogin(); showScreen('lobby');
            updateUserInfo(); loadRooms(); checkAdmin(); loadFavorites();
            toast('Bem-vindo(a) '+myName+'!','success');
            if(pendingRoomAfterLogin){ const s=pendingRoomAfterLogin; pendingRoomAfterLogin=null; setTimeout(()=>joinRoom(s),1000); }
          }
        })
        .catch(()=>{ $('landingScreen').style.display='block'; if(pendingRoomAfterLogin) toast('Faça login para entrar na sala!','error'); });
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      init();
      setInterval(()=>{ if(document.getElementById('screen-lobby').classList.contains('active')) loadRooms(); },15000);
    });
  </script>
</body>
</html>
