<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonora Fan — A melhor Vibe</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ===== ESTILOS GLOBAIS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #050508;
      --bg-elevated: #0a0a10;
      --bg-card: #0f0f18;
      --bg-hover: #161620;
      --border: #1e1e2e;
      --border-hover: #2a2a3e;
      --text: #f0f0f8;
      --text-secondary: #9a9ab0;
      --text-muted: #555570;
      --accent: #ff6b35;
      --accent2: #7c3aed;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --radius-sm: 12px;
      --bg-image: none;
      --bg-overlay: transparent;
      --accent-glow: rgba(255,107,53,0.3);
      --accent2-glow: rgba(124,58,237,0.3);
    }

    html, body {
      overflow: hidden;
      height: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      pointer-events: none;
      z-index: -1;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-elevated);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-radius: 10px;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: float 8s linear infinite;
      opacity: 0;
    }
    .particle:nth-child(2n) { background: var(--accent2); animation-duration: 10s; animation-delay: 1s; left: 20%; }
    .particle:nth-child(3n) { background: var(--success); animation-duration: 12s; animation-delay: 2s; left: 40%; }
    .particle:nth-child(4n) { background: var(--warning); animation-duration: 9s; animation-delay: 3s; left: 60%; }
    .particle:nth-child(5n) { background: var(--accent); animation-duration: 11s; animation-delay: 4s; left: 80%; }
    .particle:nth-child(6n) { background: var(--accent2); animation-duration: 13s; animation-delay: 0.5s; left: 10%; }
    .particle:nth-child(7n) { background: var(--danger); animation-duration: 7s; animation-delay: 2.5s; left: 30%; }
    .particle:nth-child(8n) { background: var(--accent); animation-duration: 14s; animation-delay: 1.5s; left: 50%; }
    .particle:nth-child(9n) { background: var(--accent2); animation-duration: 6s; animation-delay: 3.5s; left: 70%; }
    .particle:nth-child(10n) { background: var(--warning); animation-duration: 15s; animation-delay: 5s; left: 90%; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      50% { transform: translateY(-100vh) rotate(180deg); }
    }

    /* ===== LANDING ===== */
    .landing-screen {
      position: relative;
      z-index: 90;
      flex: 1;
      overflow-y: auto;
      background: transparent;
    }
    .landing-inner {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 64px 24px 40px;
    }
    .landing-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 56px;
    }
    .landing-logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .landing-logo span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .landing-hero {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 72px;
    }
    .landing-hero h1 {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.08;
      margin-bottom: 20px;
    }
    .landing-hero h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .landing-hero p {
      color: var(--text-secondary);
      font-size: 17px;
      line-height: 1.65;
      max-width: 560px;
      margin: 0 auto 36px;
    }
    .landing-ctas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 44px;
    }
    .landing-cta-primary, .landing-cta-secondary {
      padding: 15px 28px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      border: none;
    }
    .landing-cta-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .landing-cta-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(124,58,237,0.35); }
    .landing-cta-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-hover);
    }
    .landing-cta-secondary:hover { background: var(--bg-hover); border-color: var(--accent2); }

    .landing-features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 64px;
    }
    .landing-feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      transition: all 0.2s;
    }
    .landing-feature-card:hover { border-color: var(--border-hover); transform: translateY(-3px); }
    .landing-feature-card .icon { font-size: 26px; margin-bottom: 14px; }
    .landing-feature-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .landing-feature-card p { font-size: 13.5px; color: var(--text-secondary); line-height: 1.6; }

    .landing-cta-band {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .landing-cta-band::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    }
    .landing-cta-band h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    .landing-cta-band p { color: var(--text-secondary); font-size: 14px; margin-bottom: 22px; }

    /* ===== LOGIN ===== */
    .login-screen {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .login-screen.active { display: flex; }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 56px 44px;
      text-align: center;
      max-width: 420px;
      width: 92%;
      max-height: 92vh;
      overflow-y: auto;
      position: relative;
      backdrop-filter: blur(12px);
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    }
    .login-card .logo { font-size: 56px; margin-bottom: 12px; }
    .login-card h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
    .login-card h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .login-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
    .login-card input {
      width: 100%; padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 15px; outline: none; margin-bottom: 12px; transition: all 0.2s; font-family: inherit;
    }
    .login-card input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
    .login-card .login-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; }
    .login-card .login-error.show { display: block; }
    .login-card button { width: 100%; padding: 16px; border-radius: var(--radius-sm); border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .login-card button:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(124,58,237,0.3); }
    .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-switch { margin-top: 16px; color: var(--text-muted); font-size: 13px; }
    .login-switch a { color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: none; }

    /* ===== MODAIS ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; width: 90%; max-width: 480px; max-height: 92vh; overflow-y: auto; position: relative; animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--radius) var(--radius) 0 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
    .modal input, .modal select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; margin-bottom: 14px; font-family: inherit; transition: all 0.2s; }
    .modal input:focus, .modal select:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    .form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; margin-top: 14px; }
    .form-label:first-of-type { margin-top: 0; }
    .form-label .required { color: var(--danger); margin-left: 2px; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .chip:hover { border-color: var(--border-hover); }
    .chip.selected { border-color: var(--accent); background: rgba(255,107,53,0.15); color: var(--text); }
    .form-error { color: var(--danger); font-size: 12px; margin-top: -10px; margin-bottom: 10px; display: none; }
    .form-error.show { display: block; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .modal-actions button { padding: 10px 20px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .modal-actions .btn-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }
    .modal-actions .btn-secondary:hover { background: var(--bg-hover); }
    .modal-actions .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .modal-actions .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.3); }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ===== ADMIN PANEL ===== */
    .admin-panel {
      max-width: 700px !important;
      max-height: 90vh;
      overflow-y: auto !important;
    }

    .admin-user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .admin-user-item .name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }

    .admin-user-item .email {
      font-size: 12px;
      color: var(--text-muted);
    }

    .admin-user-item .actions {
      display: flex;
      gap: 6px;
    }

    .admin-user-item .actions button {
      padding: 2px 10px;
      border-radius: 4px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .admin-user-item .actions .promote {
      background: var(--accent2);
      color: #fff;
    }

    .admin-user-item .actions .delete {
      background: var(--danger);
      color: #fff;
    }

    .admin-badge-mini {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ===== APP ===== */
    .app { 
      position: relative; 
      z-index: 1; 
      display: flex; 
      flex-direction: column; 
      flex: 1; 
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    .hidden { display: none !important; }
    .screen { 
      display: none; 
      flex-direction: column; 
      flex: 1;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    .screen.active { 
      display: flex;
      height: 100%;
      max-height: 100%;
    }

    .header {
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 12px 24px;
      border-bottom: 1px solid var(--border); 
      background: rgba(0,0,0,0.5); 
      backdrop-filter: blur(20px);
      flex-shrink: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header .user-info { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); }
    .logout-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.15s; font-weight: 500; font-family: inherit; }
    .logout-btn:hover { background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger); }

    .admin-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .admin-toggle-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent2);
      transform: scale(1.05);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      background: var(--bg-card);
    }

    .theme-toggle-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent2);
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .theme-toggle-btn:active {
      transform: scale(0.95);
    }

    .admin-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }
    .admin-badge.hidden { display: none; }

    /* ===== LOBBY ===== */
    .lobby { 
      padding: 32px; 
      max-width: 1200px; 
      margin: 0 auto; 
      width: 100%; 
      flex: 1;
      overflow-y: auto;
    }
    .lobby-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .lobby-top h2 { font-size: 24px; font-weight: 700; }
    .lobby-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .lobby-actions button { padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
    .lobby-actions button:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(124,58,237,0.3); }

    .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .room-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.3s ease; overflow: hidden; }
    .room-card:hover { border-color: var(--border-hover); transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.45); }
    .room-thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, var(--accent2-glow), var(--accent-glow)); overflow: hidden; }
    .room-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .room-live-badge { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); font-size: 11px; font-weight: 700; color: var(--text); z-index: 2; }
    .room-live-badge .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .room-listeners-badge { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; color: var(--text); z-index: 2; }
    .room-card-body { padding: 16px 18px 18px; }
    .room-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .room-card .meta { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-muted); }

    /* ===== TOAST ===== */
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--bg-card); border: 1px solid var(--border); color: var(--text); padding: 14px 28px; border-radius: var(--radius-sm); font-size: 14px; z-index: 300; opacity: 0; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; font-weight: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--danger); color: #fca5a5; }
    .toast.success { border-color: var(--success); color: #86efac; }

    /* ===== ROOM ===== */
    .room-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      grid-template-rows: 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    #screen-room .app { height: 100%; max-height: 100%; overflow: hidden; }
    @media (max-width: 1024px) { .room-layout { grid-template-columns: 1fr; grid-template-rows: 1fr 420px; } }

    .stage {
      display: flex;
      flex-direction: column;
      padding: 16px 20px 20px;
      gap: 16px;
      overflow-y: auto;
      min-height: 0;
      flex: 1;
      background: rgba(0,0,0,0.2);
      height: 100%;
      max-height: 100%;
    }

    .player-section {
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      overflow: hidden;
      flex-shrink: 0;
    }
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    .now-playing-label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--danger); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; }
    #youtube-player { width: 100%; height: 280px; background: #000; }
    .player-info { display: flex; gap: 14px; align-items: center; padding: 14px 16px; }
    .cover { width: 60px; height: 60px; border-radius: 10px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border); }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .track-info { flex: 1; min-width: 0; }
    .track-title { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: var(--text-secondary); margin-top: 2px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-dj { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .track-actions { display: flex; gap: 8px; margin-top: 4px; }
    .track-actions button { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary); padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s; font-family: inherit; display: flex; align-items: center; gap: 4px; }
    .track-actions button:hover { background: var(--bg-hover); border-color: var(--accent2); }
    .progress-section { padding: 0 16px 14px; }
    .progress-bar { width: 100%; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.5s linear; }
    .progress-time { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--text-muted); }
    .volume-control { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .volume-control input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: var(--border); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

    /* ===== QUEUE - CORREÇÃO PARA EXIBIR EM 100% ===== */
    .queue-center {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      overflow: hidden;
      height: 100%;
    }

    .queue-center-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(0,0,0,0.2);
    }

    .queue-center-header span { 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--text-secondary); 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }

    .queue-center-header .count { 
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 600; 
    }

    .queue-center-header .actions { 
      display: flex; 
      gap: 8px; 
    }

    .queue-center-header .actions button { 
      background: transparent; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      color: var(--text-muted); 
      padding: 2px 8px; 
      font-size: 11px; 
      cursor: pointer; 
      transition: all 0.15s; 
      font-family: inherit; 
    }

    .queue-center-header .actions button:hover { 
      background: var(--bg-hover); 
      border-color: var(--accent2); 
      color: var(--text); 
    }

    #queueList { 
      flex: 1; 
      overflow-y: auto; 
      padding: 8px 12px 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 4px;
      min-height: 0;
      height: 100%;
      max-height: 100%;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.15s;
      cursor: default;
      border-left: 3px solid transparent;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .queue-item:hover { background: var(--bg-hover); }
    .queue-item.current { background: var(--bg-hover); border-left-color: var(--accent); }
    .queue-item .pos { font-size: 11px; color: var(--text-muted); min-width: 20px; text-align: center; font-weight: 600; }
    .queue-item.current .pos { color: var(--accent); }
    .queue-item .thumb { width: 36px; height: 27px; border-radius: 4px; overflow: hidden; flex-shrink: 0; background: var(--bg); }
    .queue-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .queue-item .info { flex: 1; min-width: 80px; }
    .queue-item .info .title { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-item.current .info .title { color: var(--text); font-weight: 600; }
    .queue-item .info .artist { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-item .dj { font-size: 9px; color: var(--text-muted); flex-shrink: 0; padding: 1px 6px; background: var(--bg); border-radius: 10px; }
    .queue-item.dragging { opacity: 0.5; }
    .queue-item.drag-over { border: 2px dashed var(--accent); }

    /* ===== VOTAÇÃO ===== */
    .queue-votes {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 4px;
    }
    .vote-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: all 0.15s;
      font-family: inherit;
      opacity: 0.5;
    }
    .vote-btn:hover { opacity: 1; transform: scale(1.1); }
    .vote-btn.up:hover { color: var(--success); }
    .vote-btn.down:hover { color: var(--danger); }
    .vote-btn.voted-up { opacity: 1; color: var(--success); }
    .vote-btn.voted-down { opacity: 1; color: var(--danger); }
    .vote-count { font-size: 10px; font-weight: 700; min-width: 16px; text-align: center; color: var(--text-muted); }
    .vote-count.negative { color: var(--danger); }
    .vote-count.positive { color: var(--success); }
    
    .queue-item .remove-btn { 
      background: transparent; 
      border: none; 
      color: var(--text-muted); 
      cursor: pointer; 
      font-size: 12px; 
      padding: 2px 4px; 
      border-radius: 4px; 
      transition: all 0.15s; 
      opacity: 0; 
      font-family: inherit; 
      flex-shrink: 0;
    }
    .queue-item:hover .remove-btn { opacity: 1; }
    .queue-item .remove-btn:hover { color: var(--danger); background: rgba(239,68,68,0.1); }
    .queue-item.current .remove-btn { display: none; }
    .queue-item.clickable { cursor: pointer; }
    .queue-item.clickable:hover { background: var(--bg-hover); border-left-color: var(--accent2); }

    /* ===== ADD SONG ===== */
    .add-song {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
    }
    .add-song input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: all 0.2s; font-family: inherit; }
    .add-song input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    .add-song button { padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap; }
    .add-song button:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(124,58,237,0.3); }

    .song-preview {
      display: flex;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      align-items: center;
      flex-shrink: 0;
    }
    .song-preview.hidden { display: none; }
    .song-preview-thumb { width: 50px; height: 38px; border-radius: 6px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; overflow: hidden; position: relative; border: 1px solid var(--border); }
    .song-preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .song-preview-duration { position: absolute; bottom: 2px; right: 2px; font-size: 9px; background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 3px; color: #fff; }
    .song-preview-info { flex: 1; min-width: 0; }
    .song-preview-title { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-preview-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-preview-status { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .song-preview-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .song-preview-actions.hidden { display: none; }
    .song-preview-confirm { padding: 5px 12px; border-radius: 6px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 600; font-size: 12px; cursor: pointer; font-family: inherit; }
    .song-preview-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
    .song-preview-confirm:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
    .song-preview-cancel { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit; }
    .song-preview-cancel:hover { background: var(--bg-hover); }
    .song-preview-fav { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .song-preview-fav:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--accent); }
    .cooldown-text { font-size: 12px; color: var(--accent); text-align: center; padding: 6px; border-radius: 8px; background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.2); flex-shrink: 0; }
    .cooldown-text.hidden { display: none; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 1024px) {
      .sidebar { border-left: none; border-top: 1px solid var(--border); height: 420px; max-height: 420px; }
    }

    .users-panel { padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: rgba(0,0,0,0.2); }
    .users-panel .user-count { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 14px; font-weight: 600; }
    .users-panel .user-count .icon { font-size: 18px; }

    /* ===== CHAT ===== */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      overflow: hidden;
      height: 100%;
      max-height: 100%;
    }

    .chat-messages {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 0;
      min-height: 0;
      max-height: 100%;
      height: 100%;
      position: relative;
    }

    .chat-messages-inner {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 10px 14px;
      scroll-behavior: smooth;
      min-height: 0;
      max-height: 100%;
    }

    .chat-messages-inner::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
    .chat-messages-inner {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .msg {
      display: flex;
      gap: 8px;
      line-height: 1.5;
      padding: 4px 8px;
      border-radius: 8px;
      animation: msgIn 0.2s ease;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .msg:hover {
      background: rgba(255,255,255,0.02);
    }

    .msg.removing {
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      height: 0;
      padding: 0 8px;
      margin: 0;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .msg-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    .msg-content { flex: 1; min-width: 0; }
    .msg-header { display: flex; align-items: center; gap: 6px; margin-bottom: 1px; }
    .msg-user { font-weight: 700; font-size: 12px; cursor: pointer; }
    .msg-time { font-size: 10px; color: var(--text-muted); opacity: 0.5; }
    .msg-text { color: var(--text-secondary); word-break: break-word; font-size: 13px; }
    .msg-system .msg-text { color: var(--text-muted); font-style: italic; font-size: 12px; }
    .msg-music { background: rgba(124,58,237,0.05); border-radius: 8px; padding: 6px 10px; }
    .msg-music .music-info { color: var(--text); font-weight: 600; font-size: 13px; margin-top: 2px; }

    .msg-actions { display: flex; align-items: center; gap: 4px; margin-top: 2px; margin-left: 30px; }
    .msg-like-btn { background: transparent; border: none; cursor: pointer; font-size: 12px; padding: 2px 4px; border-radius: 8px; color: var(--text-muted); transition: all 0.15s; display: flex; align-items: center; gap: 2px; font-family: inherit; }
    .msg-like-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
    .msg-like-btn.liked { color: var(--accent); background: rgba(255,107,53,0.1); }
    .msg-like-count { font-size: 10px; font-weight: 600; }

    .chat-input-bar {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--bg-card);
      flex-shrink: 0;
      position: relative;
    }
    .chat-input-bar input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; outline: none; transition: all 0.2s; font-family: inherit; }
    .chat-input-bar input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    .chat-input-bar button { padding: 8px 14px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap; }
    .chat-input-bar button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,58,237,0.3); }

    .emoji-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background 0.15s; flex-shrink: 0; }
    .emoji-btn:hover { background: var(--bg-hover); }
    .emoji-panel { display: none; position: absolute; bottom: 100%; left: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; max-width: 260px; max-height: 160px; overflow-y: auto; flex-wrap: wrap; gap: 3px; z-index: 50; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .emoji-panel.show { display: flex; }
    .emoji-item { font-size: 20px; cursor: pointer; padding: 3px 5px; border-radius: 4px; transition: background 0.15s; line-height: 1; }
    .emoji-item:hover { background: var(--bg-hover); }

    .footer {
      text-align: center;
      padding: 12px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
      width: 100%;
    }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* ===== FAVORITOS MODAL ===== */
    .favorite-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .favorite-item .info { flex: 1; min-width: 0; }
    .favorite-item .title { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .favorite-item .artist { font-size: 11px; color: var(--text-secondary); }
    .favorite-item .actions { display: flex; gap: 6px; }
    .favorite-item .actions button { padding: 3px 8px; border-radius: 4px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .favorite-item .actions .add { background: var(--accent2); color: #fff; }
    .favorite-item .actions .add:hover { opacity: 0.8; }
    .favorite-item .actions .remove { background: var(--danger); color: #fff; }
    .favorite-item .actions .remove:hover { opacity: 0.8; }

    @media (max-width: 768px) {
      .header { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
      .header h1 { font-size: 15px; }
      #youtube-player { height: 200px; }
      .player-info { padding: 10px 12px; }
      .cover { width: 48px; height: 48px; font-size: 18px; }
      .track-title { font-size: 14px; }
      .queue-item { padding: 6px 8px; flex-wrap: wrap; }
      .queue-item .thumb { width: 32px; height: 24px; }
      .queue-item .info .title { font-size: 11px; }
      .queue-votes { margin-left: 0; }
      .room-layout { grid-template-rows: 1fr 380px; }
      .sidebar { height: 380px; max-height: 380px; }
    }
    @media (max-width: 480px) {
      .stage { padding: 10px 12px; }
      #youtube-player { height: 160px; }
      .add-song { flex-direction: column; }
      .add-song button { width: 100%; }
      .song-preview { flex-wrap: wrap; }
      .song-preview-actions { width: 100%; justify-content: flex-end; }
      .room-layout { grid-template-rows: 1fr 320px; }
      .sidebar { height: 320px; max-height: 320px; }
    }
  </style>
